# Keeps the free-tier Supabase project awake: a project with no activity for
# 7 days is paused automatically, which breaks login/signup/sync in the apps.
# One REST query per day counts as activity.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:        # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: https://kbkxzvsgusakjgmnbbmx.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/body -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/range_collections?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          cat /tmp/body; echo
          # 200 = ok, 401/403 = reached the DB but RLS denied (still counts as activity)
          case "$code" in
            200|401|403) echo "Supabase reached." ;;
            *) echo "::error::Supabase unreachable (HTTP $code) — the project is probably paused. Resume it at https://supabase.com/dashboard"; exit 1 ;;
          esac
